version: '2'
services:
  node-exporter:
    image: prom/node-exporter
    network_mode: host
    volumes:
      - /:/host:ro,rslave
    pid: host
    command:
      - --path.rootfs
      - /host
    labels:
      io.rancher.container.pull_image: always
      io.rancher.scheduler.global: 'true'
  proxy:
    image: manastech/promproxy:v3
    environment:
      PROMPROXY_ENV_LABEL: ${PROMPROXY_ENV_LABEL}
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${PROMPROXY_PORT}:9999/tcp
    labels:
      io.rancher.container.dns: 'true'
      io.rancher.container.pull_image: always
      io.rancher.scheduler.global: 'true'
      io.rancher.sidekicks: proxy-healthcheck
  proxy-healthcheck:
    # Rancher can't health check the proxy itself because it uses host
    # networking, so this forwards to it from the managed network and the
    # health check goes here instead (see rancher-compose.yml). When it fails,
    # Rancher recreates the whole deployment unit, proxy included.
    image: alpine/socat:1.8.1.3
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        until host_ip=$$(ip route | awk '/^default/ {print $$3}') && [ -n "$$host_ip" ]; do
          sleep 1
        done
        exec socat TCP-LISTEN:9999,fork,reuseaddr TCP:$$host_ip:9999
    labels:
      io.rancher.container.pull_image: always
  haproxy-exporter:
    image: prom/haproxy-exporter
    network_mode: host
    command:
      - --haproxy.scrape-uri=http://localhost:9000/haproxy_stats;csv
    labels:
      io.rancher.container.pull_image: always
      io.rancher.scheduler.global: 'true'
  rancher-exporter:
    image: manastech/rancher-v1.6-prometheus-rancher-exporter
    labels:
      io.rancher.container.agent.role: environment
      io.rancher.container.create_agent: 'true'
      io.rancher.container.pull_image: always
  docker-cluster-exporter:
    privileged: true
    image: instedd/docker-cluster-exporter
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys:/host/sys
    pid: host
    labels:
      io.rancher.container.pull_image: always
      io.rancher.scheduler.global: 'true'

  {{- if eq .Values.ENABLE_PROMTAIL "true" -}}
  promtail:
    privileged: true
    image: manastech/promtail-rancher:2.8.4-1
    environment:
      LOKI_URL: ${LOKI_URL}
      TENANT_ID: ${LOKI_TENANT_ID}
      ENVIRONMENT: ${PROMPROXY_ENV_LABEL}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    labels:
      io.rancher.container.pull_image: always
  {{- end -}}
